name: guftagu
description: "Guftagu - Familiar, dependable, thoughtfully designed messenger. Dev: Saad Hussain, Co-Dev: Ashad Ahamad"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  drift_flutter: ^0.2.7
  flutter_secure_storage: ^9.2.4
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  record: ^6.1.1
  audioplayers: ^6.1.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.3
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/wallpapers/
