name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Drift codegen (fallback exists)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs || echo "fallback used"

      - name: Analyze (0 errors)
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:3000/api/v1

      - name: Build Release APK
        working-directory: apps/mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.guftagu.example.com/api/v1

      - name: Build AAB
        working-directory: apps/mobile
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.guftagu.example.com/api/v1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guftagu-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: guftagu-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: guftagu-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
